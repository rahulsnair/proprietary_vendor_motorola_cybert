[policy_type]
# V1.2
# If permanent= Yes, this policy is still valid after reboot
# permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 85000
min_target_tj= 85000
trip_tpcb= 78000
target_tpcb= 80000

[vtskin-param]
sensor= vtskin1
operation= coefficient
ref_sensor= [quiet_ntc,ap_ntc,schg_ntc,nrpa_ntc,wcn_ntc]
ref_coef= [53000000,16000000,6000000,9000000,16000000]

[thermalhal-threshold]
type= SKIN
sensor= vtskin1
level= [severe, critical, emergency, shutdown]
threshold= [47900, 55000, 67000, 68000]
hysteresis= [2000, 7100, 1000, 1000]

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [quiet_ntc,ap_ntc,schg_ntc,nrpa_ntc,wcn_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.56,0.14,0.07,0.06,0.17]
offset=0
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [quiet_ntc,ap_ntc,schg_ntc,nrpa_ntc,wcn_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.53,0.16,0.06,0.09,0.16]
offset=500
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= bchg_temp
ref_sensor= [quiet_ntc,ap_ntc,schg_ntc,nrpa_ntc,wcn_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.56,0.14,0.07,0.06,0.17]
offset=500
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 0
threshold= [38000, 47000, 56000]
hysteresis= [2000, 2000, 2000]
freq= [1800000, 1500000, 1200000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 1
threshold= [36000, 38000, 40000, 42000, 46000, 48000]
hysteresis= [2000, 2000, 2000, 2000, 2000, 2000]
freq= [2300000, 2200000, 2000000, 1800000, 1600000, 1200000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 2
threshold= [36000, 38000, 40000, 42000, 46000, 48000]
hysteresis= [2000, 2000, 2000, 2000, 2000, 2000]
freq= [2300000, 2200000, 2000000, 1800000, 1400000, 1200000]

[mtk-cpu-isolate]
mode= enabled
sensor= front_temp
cpu= [CPU7]
threshold= [50000]
hysteresis= [2000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= front_temp
threshold= [38000, 40000, 41000, 42000, 43000, 45000]
hysteresis= [2000, 2000, 1000, 1000, 1000, 3000]
freq= [836000, 720000, 661000, 522000, 364000, 265000]

[general-cooler]
sensor= front_temp
sensor_class= virtual
cooler= apu_cooler
cooler_class= kernel
algorithm= table_mapping
threshold= [45000, 48000]
hysteresis= [2000, 3000]
limit_state= [5, 6]

[charger-cooler]
mode= enabled
sensor= front_temp
threshold= [33000, 37000, 38000, 38500, 39000, 39500, 41000, 43000, 45000, 48000]
hysteresis= [2000, 2000, 500, 500, 500, 500, 1000, 1000, 1000, 1000]
current= [10000, 8000, 7000, 6000, 5000, 4000, 3000, 2000, 1000, 500]

[general-cooler]
sensor= bchg_temp
sensor_class= kernel
cooler= moto_wlc
cooler_class= kernel
algorithm= table_mapping
threshold= [35000, 37000, 39000, 40000, 42000, 44000, 46000]
hysteresis= [2000, 2000, 2000, 1000, 2000, 2000, 2000]
limit_state= [1, 2, 3, 4, 5, 6, 7]

[md-autonomous-ctrl]
mode= disabled

[md-cc-ctrl-cooler]
mode= enabled
sensor= back_temp
threshold= [45000, 46000, 48000, 50000]
hysteresis= [1000, 1000, 1000, 1000]
limit-state= [16712447, 16712191, 16711937, 16711935]

[md-ul-throttle-cooler]
mode= enabled
sensor= back_temp
threshold= [45000, 46000, 48000, 50000]
hysteresis= [1000, 1000, 1000, 1000]
limit-state= [1, 2, 3, 4]
